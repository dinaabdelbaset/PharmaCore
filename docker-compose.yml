services:
  db:
    image: postgres:17-alpine
    container_name: pharmacore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: PharmaCoreDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PharmaCoreDB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: PharmaCore.API/Dockerfile
    container_name: pharmacore_api
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=PharmaCoreDB;Username=postgres;Password=12345;Trust Server Certificate=true
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5117:5117"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./PharmaCore.WEB
      dockerfile: Dockerfile
    container_name: pharmacore_web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5117/api
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
