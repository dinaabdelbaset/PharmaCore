# =========================================================================
# Nginx Configuration File for yourdomain.com and www.yourdomain.com
# Place this file in your Nginx configuration directory (e.g., /etc/nginx/nginx.conf)
# =========================================================================

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Include default MIME types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log formats
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Performance optimization settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression Options
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Map block to handle Connection headers for WebSocket support (Upgrade mechanism)
    # Required for WebSockets (e.g. Next.js Hot Module Replacement or real-time ASP.NET Core SignalR)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # =========================================================================
    # 1. Port 80 (HTTP) -> HTTPS Redirect Block
    # Redirects all traffic from http://yourdomain.com and http://www.yourdomain.com
    # to the canonical https://yourdomain.com
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name yourdomain.com www.yourdomain.com;

        # Permanent redirect to canonical HTTPS URL
        return 301 https://yourdomain.com$request_uri;
    }

    # =========================================================================
    # 2. Port 443 (HTTPS) www -> HTTPS non-www Redirect Block
    # Redirects all traffic from https://www.yourdomain.com to the canonical https://yourdomain.com
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.yourdomain.com;

        # SSL Configuration - Update with actual certificate paths
        # Usually obtained via Certbot (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        # Recommended SSL protocols and ciphers (Modern / Secure profiles)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # Session cache and timeouts for performance
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Permanent redirect to canonical non-www HTTPS URL
        return 301 https://yourdomain.com$request_uri;
    }

    # =========================================================================
    # 3. Port 443 (HTTPS) canonical non-www (https://yourdomain.com)
    # Handles reverse proxying to Next.js (port 3000) and ASP.NET Core API (port 5001)
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name yourdomain.com;

        # SSL Configuration - Update with actual certificate paths
        ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        # Recommended SSL protocols and ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # Session cache and timeouts for performance
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
        # HSTS (Optional but recommended: 1 year in seconds)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---------------------------------------------------------------------
        # ASP.NET Core API Reverse Proxy (Port 5001)
        # Matches any request starting with /api/ or /api
        # ---------------------------------------------------------------------
        location /api {
            # Proxy pass directly to local ASP.NET Core API server
            # No trailing slash here ensures the /api prefix remains in the forwarded URI,
            # which is typical for ASP.NET Core routing (e.g., [Route("api/[controller]")])
            proxy_pass http://127.0.0.1:5001;
            
            # Use HTTP 1.1 for connection keep-alive support
            proxy_http_version 1.1;

            # WebSocket upgrade headers (Connection upgrade mapping defined in http block)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Additional proxy settings for API responsiveness
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Disable buffering for real-time/streaming responses if needed
            proxy_buffering off;
        }

        # ---------------------------------------------------------------------
        # Next.js Server Reverse Proxy (Port 3000)
        # Matches all other requests (default fallback)
        # ---------------------------------------------------------------------
        location / {
            # Proxy pass directly to Next.js node server
            proxy_pass http://127.0.0.1:3000;

            # Use HTTP 1.1 for connection keep-alive support
            proxy_http_version 1.1;

            # WebSocket upgrade headers (important for Next.js Hot Module Replacement in dev,
            # or custom WS integrations in prod)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache bypass for WebSockets and specific headers
            proxy_cache_bypass $http_upgrade;

            # Adjust buffer sizes for Next.js assets if needed
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
